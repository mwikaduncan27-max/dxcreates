<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DXCreates To-Do App</title>
    <link rel="stylesheet" href="todo-app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Productivity</p>
          <h1>To-Do List</h1>
        </div>
        <button id="clear-completed" class="secondary-btn" type="button">Clear completed</button>
      </header>

      <main class="todo-panel">
        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">Add a task</label>
          <input
            id="todo-input"
            type="text"
            placeholder="Add a new task..."
            autocomplete="off"
            maxlength="120"
          />
          <button type="submit" class="primary-btn">Add Task</button>
        </form>

        <div class="toolbar">
          <div class="filters" aria-label="Task filters">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>

          <p id="tasks-summary" class="summary">0 tasks</p>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      </main>
    </div>

    <template id="todo-item-template">
      <li class="todo-item">
        <label class="todo-check">
          <input type="checkbox" />
          <span class="checkmark"></span>
        </label>
        <span class="todo-text"></span>
        <button class="delete-btn" type="button" aria-label="Delete task">Delete</button>
      </li>
    </template>

    <script src="todo-app.js"></script>
  </body>
</html>
